services:
  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  db:
    image: postgres:15-alpine
    container_name: quickdrop_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quickdrop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickdrop_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/quickdrop_db
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@db:5432/quickdrop_db
      - PAYSWIFT_BASE_URL=http://payswift:8081
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      payswift:
        condition: service_started

volumes:
  postgres_data:
